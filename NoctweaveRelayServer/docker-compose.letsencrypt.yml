services:
  relay:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - --host
      - 0.0.0.0
      - --port
      - "9339"
      - --http-port
      - "9340"
      - --data-dir
      - /data
      - --advertised-endpoint
      - https://${RELAY_DOMAIN}:443
      - --trusted-reverse-proxy-tls
      - "true"
    volumes:
      - relay-data:/data
    environment:
      NOCTWEAVE_ADMIN_TOKEN: ${NOCTWEAVE_ADMIN_TOKEN:?set NOCTWEAVE_ADMIN_TOKEN in .env}
      NOCTWEAVE_ICE_URLS: ${NOCTWEAVE_ICE_URLS:-}
      NOCTWEAVE_TURN_REALM: ${TURN_REALM:-noctweave}
      NOCTWEAVE_TURN_SHARED_SECRET: ${NOCTWEAVE_TURN_SHARED_SECRET:-}
    ports:
      - "127.0.0.1:9090:9090"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    restart: unless-stopped
    networks:
      - relay-net

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy-l4
    depends_on:
      - relay
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      RELAY_DOMAIN: ${RELAY_DOMAIN}
      RELAY_HTTP_UPSTREAM: relay:9340
    volumes:
      - ./Caddyfile.layer4:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    restart: unless-stopped
    networks:
      - relay-net

volumes:
  relay-data:
  caddy-data:
  caddy-config:

networks:
  relay-net:
