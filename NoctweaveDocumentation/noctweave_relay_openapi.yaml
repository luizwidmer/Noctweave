      properties:
        committedCursor:
          $ref: "#/components/schemas/OpaqueRouteCursorV2"
        highWatermark:
          $ref: "#/components/schemas/OpaqueRouteCursorV2"
        retentionFloor:
          $ref: "#/components/schemas/OpaqueRouteCursorV2"
      additionalProperties: false
    RendezvousRelayOpaque32V2:
      type: object
      required: [rawValue]
      description: |
        Nonzero 32-byte CSPRNG value. Depending on its typed request position,
        this is a route locator, opaque lane ID, publish bearer, read bearer,
        or delete bearer. All seven authority values in a registration MUST be
        distinct. Relays persist only domain-separated SHA-256 digests of
        bearers and never persist raw bearer values. Lane IDs are random labels
        and contain no purpose, identity, generation, endpoint, provider, or
        contact field.
      properties:
        rawValue:
          type: string
          contentEncoding: base64
          minLength: 44
          maxLength: 44
      additionalProperties: false
    RendezvousRelayFrameIDV2:
      type: object
      required: [rawValue]
      properties:
        rawValue:
          type: string
          contentEncoding: base64
          minLength: 24
          maxLength: 24
      additionalProperties: false
    RendezvousRelayLaneRegistrationV2:
      type: object
      required: [laneId, publishCapability, readCapability, deleteCapability]
      properties:
        laneId:
          $ref: "#/components/schemas/RendezvousRelayOpaque32V2"
        publishCapability:
          $ref: "#/components/schemas/RendezvousRelayOpaque32V2"
        readCapability:
          $ref: "#/components/schemas/RendezvousRelayOpaque32V2"
        deleteCapability:
          $ref: "#/components/schemas/RendezvousRelayOpaque32V2"
      additionalProperties: false
    RegisterRendezvousTransportV2Request:
      type: object
      required: [version, routeCapability, expiresAt, lanes]
      description: |
        Atomically creates exactly two unlabelled directional lanes. The route
        lifetime is a whole-second interval no longer than 600 seconds from
        receipt. An exact active-registration retry is idempotent, including
        after restart; different material under the same route conflicts.
        Deleted and expired routes retain bounded non-resurrection tombstones.
        This module is disabled by default and is accepted only over TLS or
        from a literal loopback development source.
      properties:
        version:
          type: integer
          const: 2
        routeCapability:
          $ref: "#/components/schemas/RendezvousRelayOpaque32V2"
        expiresAt:
          type: string
          format: date-time
        lanes:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/RendezvousRelayLaneRegistrationV2"
      additionalProperties: false
    RendezvousRelayCiphertextFrameV2:
      type: object
      required: [frameId, sequence, ciphertext]
      description: |
        Relay-opaque encrypted bytes. The relay does not decode the enclosed
        RendezvousFrameV2. Decoded ciphertext length MUST be exactly 4096,
        16384, 65536, or 131072 bytes. The largest bucket wraps an already
        padded 65536-byte encrypted rendezvous frame without leaking its size.
      properties:
        frameId:
          $ref: "#/components/schemas/RendezvousRelayFrameIDV2"
        sequence:
          type: integer
          format: uint64
          minimum: 1
          maximum: 32
        ciphertext:
          type: string
          contentEncoding: base64
      additionalProperties: false
    AppendRendezvousTransportV2Request:
      type: object
      required: [routeCapability, laneId, publishCapability, frame]
      description: |
        Appends at the next exact lane sequence. Retrying the same frame ID,
        sequence, and ciphertext digest is idempotent. Reusing a frame ID with
        different bytes, reusing a sequence with a different ID, or creating a
        gap is rejected. Each lane is limited to 32 frames and 2097152 decoded
        ciphertext bytes.
      properties:
        routeCapability:
          $ref: "#/components/schemas/RendezvousRelayOpaque32V2"
        laneId:
          $ref: "#/components/schemas/RendezvousRelayOpaque32V2"
        publishCapability:
          $ref: "#/components/schemas/RendezvousRelayOpaque32V2"
        frame:
          $ref: "#/components/schemas/RendezvousRelayCiphertextFrameV2"
      additionalProperties: false
    SyncRendezvousTransportV2Request:
      type: object
      required: [routeCapability, laneId, readCapability, afterSequence, maxCount]
      properties:
        routeCapability:
          $ref: "#/components/schemas/RendezvousRelayOpaque32V2"
        laneId:
          $ref: "#/components/schemas/RendezvousRelayOpaque32V2"
        readCapability:
          $ref: "#/components/schemas/RendezvousRelayOpaque32V2"
        afterSequence:
          type: integer
          format: uint64
          minimum: 0
          maximum: 32
        maxCount:
          type: [integer, "null"]
          minimum: 1
          maximum: 32
      additionalProperties: false
    DeleteRendezvousTransportV2Request:
      type: object
      required: [routeCapability, laneId, deleteCapability]
      description: |
        Irreversibly deletes one lane using an authority distinct from its
        publish and read bearers. Exact deletion retries are idempotent. Once
        both lanes are deleted, the route is a non-resurrectable tombstone.
      properties:
        routeCapability:
          $ref: "#/components/schemas/RendezvousRelayOpaque32V2"
        laneId:
          $ref: "#/components/schemas/RendezvousRelayOpaque32V2"
        deleteCapability:
          $ref: "#/components/schemas/RendezvousRelayOpaque32V2"
      additionalProperties: false
    RendezvousRelaySyncBatchV2:
      type: object
      required: [frames, highWatermark, nextSequence, hasMore]
      properties:
        frames:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/RendezvousRelayCiphertextFrameV2"
        highWatermark:
          type: integer
          format: uint64
          minimum: 0
          maximum: 32
        nextSequence:
          type: integer
          format: uint64
          minimum: 0
          maximum: 32
        hasMore:
          type: boolean
      additionalProperties: false
    RelayModuleCapabilityV2:
      type: object
      required: [module, versions, status, limits]
      properties:
        module:
          type: string
          pattern: "^nw\\."
          minLength: 3
          maxLength: 96
        versions:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items:
            type: integer
            minimum: 1
            maximum: 65535
        status:
          type: string
          description: |
            Module lifecycle status. The relay modules in the 1.0 candidate
            are provisional; opt-in research modules remain experimental.
            Stable remains a valid lifecycle value for a future promotion.
          enum: [experimental, provisional, stable, deprecated]
        limits:
          type: object
          maxProperties: 32
          propertyNames:
            minLength: 1
            maxLength: 96
          additionalProperties:
            type: integer
            format: uint64
            minimum: 0
      additionalProperties: false
    RelayCapabilityManifestV2:
      type: object
      required: [architectureVersion, modules]
      description: |
        Relay-terminated modules actually advertised by this relay. This is not
        an application-content capability manifest and does not authorize a
        silent protocol downgrade.
      properties:
        architectureVersion:
          type: integer
          const: 2
        modules:
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          description: |
            Modules MUST be sorted by module identifier, contain unique module
            identifiers, and include nw.core version 2.
          items:
            $ref: "#/components/schemas/RelayModuleCapabilityV2"
      additionalProperties: false
    FederationDescriptor:
      type: object
      required: [mode, name, description]
      properties:
        mode:
          type: string
          enum: [solo, manual, curated, open]
        name:
          type: [string, "null"]
          maxLength: 1024
          description: When non-null, UTF-8 encoding MUST be at most 1024 bytes.
        description:
          type: [string, "null"]
          maxLength: 1024
          description: When non-null, UTF-8 encoding MUST be at most 1024 bytes.
      additionalProperties: false
    RelayEndpoint:
      type: object
      required:
        [host, port, useTLS, transport, tlsCertificateFingerprintSHA256,
         directorySigningPublicKey]
      properties:
        host:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            Trimmed UTF-8 hostname or address with no control characters and
            at most 255 encoded bytes.
        port:
          type: integer
          minimum: 1
          maximum: 65535
        useTLS:
          type: boolean
        transport:
          type: string
          enum: [tcp, http, websocket]
        tlsCertificateFingerprintSHA256:
          type: [string, "null"]
          contentEncoding: base64
          minLength: 44
          maxLength: 44
        directorySigningPublicKey:
          type: [string, "null"]
          contentEncoding: base64
          minLength: 2604
          maxLength: 2604
          description: Base64-encoded current ML-DSA-65 public key when present.
      additionalProperties: false
    HiddenRetrievalPIRReplica:
      type: object
      required: [replicaId, operatorId, endpoint]
      properties:
        replicaId:
          type: string
          minLength: 1
          maxLength: 1024
          description: Trimmed UTF-8 identifier of at most 1024 encoded bytes.
        operatorId:
          type: string
          minLength: 1
          maxLength: 1024
          description: Trimmed UTF-8 identifier of at most 1024 encoded bytes.
        endpoint:
          $ref: "#/components/schemas/RelayEndpoint"
      additionalProperties: false
    HiddenRetrievalSupport:
      type: object
      required:
        [mode, defaultCoverSetSize, maxCoverSetSize, replicatedXorPIRReplicas]
      description: |
        defaultCoverSetSize MUST be no greater than maxCoverSetSize. Replica,
        operator, and canonical endpoint identifiers MUST each be unique. The
        replicatedXorPIR mode requires at least two replicas; a null replica
        list is permitted only for coverQuery.
      properties:
        mode:
          type: string
          enum: [coverQuery, replicatedXorPIR]
        defaultCoverSetSize:
          type: integer
          minimum: 2
          maximum: 4096
        maxCoverSetSize:
          type: integer
          minimum: 2
          maximum: 4096
        replicatedXorPIRReplicas:
          oneOf:
            - type: array
              minItems: 1
              maxItems: 256
              uniqueItems: true
              items:
                $ref: "#/components/schemas/HiddenRetrievalPIRReplica"
            - type: "null"
      oneOf:
        - properties:
            mode: { const: coverQuery }
        - properties:
            mode: { const: replicatedXorPIR }
            replicatedXorPIRReplicas:
              type: array
              minItems: 2
              maxItems: 256
      additionalProperties: false
    OnionTransportSupport:
      type: object
      required: [enabled, maxHops, requiresFixedSizePackets]
      properties:
        enabled: { type: boolean }
        maxHops:
          type: integer
          minimum: 1
          maximum: 8
        requiresFixedSizePackets: { type: boolean }
      additionalProperties: false
    MixnetTransportSupport:
      type: object
      required:
        [enabled, batchIntervalSeconds, minBatchSize, coverPacketsPerBatch,
         maxDelaySeconds]
      properties:
        enabled: { type: boolean }
        batchIntervalSeconds:
          type: integer
          minimum: 5
          maximum: 3600
        minBatchSize:
          type: integer
          minimum: 1
          maximum: 256
        coverPacketsPerBatch:
          type: integer
          minimum: 0
          maximum: 256
        maxDelaySeconds:
          type: integer
          minimum: 0
          maximum: 3600
      additionalProperties: false
    DecentralizedWakeSupport:
      type: object
      required:
        [mode, minPollIntervalSeconds, maxPollIntervalSeconds, jitterPermille,
         longPollTimeoutSeconds]
      description: |
        minPollIntervalSeconds MUST be no greater than maxPollIntervalSeconds.
        pullOnly requires a null timeout. longPoll requires a timeout between 5
        and maxPollIntervalSeconds.
      properties:
        mode:
          type: string
          enum: [pullOnly, longPoll]
        minPollIntervalSeconds:
          type: integer
          minimum: 5
          maximum: 86400
        maxPollIntervalSeconds:
          type: integer
          minimum: 5
          maximum: 86400
        jitterPermille:
          type: integer
          minimum: 0
          maximum: 1000
        longPollTimeoutSeconds:
          type: [integer, "null"]
          minimum: 5
          maximum: 86400
      oneOf:
        - properties:
            mode: { const: pullOnly }
            longPollTimeoutSeconds: { type: "null" }
        - properties:
            mode: { const: longPoll }
            longPollTimeoutSeconds: { type: integer, minimum: 5, maximum: 86400 }
      additionalProperties: false
    RelayICEServiceDescriptorV1:
      type: object
      required: [version, urls, credentialMode, credentialLifetimeSeconds, realm, relayOnlySupported]
      description: |
        Canonical STUN/TURN discovery data. URLs are sorted and unique. The
        turn-rest mode requires at least one TURN URL, a realm, and a lifetime.
      properties:
        version: { type: integer, const: 1 }
        urls:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 2048
            pattern: '^(stun|stuns|turn|turns):[^@#\s]+$'
        credentialMode:
          type: string
          enum: [none, turn-rest]
        credentialLifetimeSeconds:
          type: [integer, "null"]
          minimum: 60
          maximum: 3600
        realm:
          type: [string, "null"]
          minLength: 1
          maxLength: 255
        relayOnlySupported: { type: boolean }
      additionalProperties: false
    RelayICECredentialRequestV1:
      type: object
      required: [version, nonce, requestedLifetimeSeconds]
      properties:
        version: { type: integer, const: 1 }
        nonce:
          type: string
          contentEncoding: base64
          minLength: 24
          maxLength: 24
        requestedLifetimeSeconds:
          type: [integer, "null"]
          minimum: 60
          maximum: 3600
      additionalProperties: false
    ICECredentialRequestBody:
      type: object
      required: [request]
      properties:
        request: { $ref: "#/components/schemas/RelayICECredentialRequestV1" }
      additionalProperties: false
    RelayICECredentialsV1:
      type: object
      required: [version, urls, username, credential, realm, issuedAt, expiresAt]
      properties:
        version: { type: integer, const: 1 }
        urls:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 2048
            pattern: '^(turn|turns):[^@#\s]+$'
        username: { type: string, minLength: 1, maxLength: 512 }
        credential: { type: string, minLength: 1, maxLength: 512 }
        realm: { type: string, minLength: 1, maxLength: 255 }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
      additionalProperties: false
    OpenFederationDiscoverySupport:
      type: object
      required:
        [dhtNodeEnabled, peerExchangeEnabled, peerExchangeLimit,
         requirePublicEndpoint, maxDHTRecords, maxDHTRecordsPerHost,
         maxDHTQueryRecords]
      description: maxDHTRecordsPerHost MUST be no greater than maxDHTRecords.
      properties:
        dhtNodeEnabled: { type: boolean }
        peerExchangeEnabled: { type: boolean }
        peerExchangeLimit:
          type: integer
          minimum: 0
          maximum: 128
        requirePublicEndpoint: { type: boolean }
        maxDHTRecords:
          type: integer
          minimum: 1
          maximum: 256
        maxDHTRecordsPerHost:
          type: integer
          minimum: 1
          maximum: 16
        maxDHTQueryRecords:
          type: integer
          minimum: 1
          maximum: 512
      additionalProperties: false
    EncryptedPayload:
      type: object
      required: [nonce, ciphertext, tag]
      properties:
        nonce:
          type: string
          contentEncoding: base64
          minLength: 16
          maxLength: 16
        ciphertext:
          type: string
          contentEncoding: base64
          minLength: 4
          maxLength: 174728
        tag:
          type: string
          contentEncoding: base64
          minLength: 24
          maxLength: 24
      additionalProperties: false
    UploadAttachmentRequest:
      type: object
      required: [attachmentId, chunkIndex, payload, ttlSeconds, idempotencyKey]
      properties:
        attachmentId: { type: string, format: uuid }
        chunkIndex: { type: integer, minimum: 0, maximum: 511 }
        payload: { $ref: "#/components/schemas/EncryptedPayload" }
        ttlSeconds:
          type: [integer, "null"]
          minimum: 60
          maximum: 2592000
        idempotencyKey:
          type: string
          contentEncoding: base64
          minLength: 44
          maxLength: 44
      additionalProperties: false
    FetchAttachmentRequest:
      type: object
      required: [attachmentId, chunkIndex]
      properties:
        attachmentId: { type: string, format: uuid }
        chunkIndex: { type: integer, minimum: 0, maximum: 511 }
      additionalProperties: false
    AttachmentChunk:
      type: object
      required: [attachmentId, chunkIndex, payload]
      description: Decoded nonce, ciphertext, and tag bytes total at most 131072 bytes.
      properties:
        attachmentId: { type: string, format: uuid }
        chunkIndex: { type: integer, minimum: 0, maximum: 511 }
        payload: { $ref: "#/components/schemas/EncryptedPayload" }
      additionalProperties: false
    FederationNodeRegistrationRequest:
      type: object
      required: [endpoint, relayInfo, ttlSeconds]
      properties:
        endpoint: { $ref: "#/components/schemas/RelayEndpoint" }
        relayInfo: { $ref: "#/components/schemas/RelayInfo" }
        ttlSeconds:
          type: [integer, "null"]
          minimum: 1
          maximum: 900
      additionalProperties: false
    ListFederationNodesRequest:
      type: object
      required: [mode, federationName, onlyHealthy, maxStalenessSeconds, requireSignedSnapshot]
      properties:
        mode:
          type: [string, "null"]
          enum: [solo, manual, curated, open, null]
        federationName:
          type: [string, "null"]
          maxLength: 1024
          description: When non-null, UTF-8 encoding MUST be at most 1024 bytes.
        onlyHealthy: { type: [boolean, "null"] }
        maxStalenessSeconds:
          type: [integer, "null"]
          minimum: 1
          maximum: 86400
        requireSignedSnapshot: { type: [boolean, "null"] }
      additionalProperties: false
    FederationNodeRecord:
      type: object
      required: [endpoint, relayInfo, lastHeartbeatAt, expiresAt]
      description: |
        Timestamps use canonical whole-second UTC encoding. expiresAt MUST be
        later than lastHeartbeatAt and no more than 900 seconds after it.
      properties:
        endpoint: { $ref: "#/components/schemas/RelayEndpoint" }
        relayInfo: { $ref: "#/components/schemas/RelayInfo" }
        lastHeartbeatAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
      additionalProperties: false
    FederationDirectorySnapshot:
      type: object
      required:
        [version, mode, federationName, issuedAt, validUntil,
         maxStalenessSeconds, nodes, signatureAlgorithm, signature]
      description: |
        Timestamps use canonical whole-second UTC encoding. validUntil MUST be
        later than issuedAt and no more than maxStalenessSeconds after it.
        Canonical relay endpoints in nodes MUST be unique. signatureAlgorithm
        and signature are either both null or a complete ML-DSA-65 signature.
      properties:
        version: { type: integer, const: 1 }
        mode: { type: string, enum: [solo, manual, curated, open] }
        federationName:
          type: [string, "null"]
          maxLength: 1024
          description: When non-null, UTF-8 encoding MUST be at most 1024 bytes.
        issuedAt: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
        maxStalenessSeconds: { type: integer, minimum: 1, maximum: 86400 }
        nodes:
          type: array
          maxItems: 10000
          uniqueItems: true
          items: { $ref: "#/components/schemas/FederationNodeRecord" }
        signatureAlgorithm:
          type: [string, "null"]
          enum: [ML-DSA-65, null]
        signature:
          type: [string, "null"]
          contentEncoding: base64
          minLength: 4412
          maxLength: 4412
      oneOf:
        - properties:
            signatureAlgorithm: { type: "null" }
            signature: { type: "null" }
        - properties:
            signatureAlgorithm: { const: ML-DSA-65 }
            signature:
              type: string
              contentEncoding: base64
              minLength: 4412
              maxLength: 4412
      additionalProperties: false
    OpenFederationDHTRecord:
      type: object
      required: [version, namespace, relayIdentityDigest, endpoint, issuedAt, expiresAt, relaySigningPublicKey, signatureAlgorithm, signature]
      properties:
        version: { type: integer, const: 1 }
        namespace: { type: string }
        relayIdentityDigest: { type: string }
        endpoint: { $ref: "#/components/schemas/RelayEndpoint" }
        federationName: { type: string }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        relaySigningPublicKey: { type: string, contentEncoding: base64 }
        signatureAlgorithm: { type: string, const: ML-DSA-65 }
        signature: { type: string, contentEncoding: base64 }
      additionalProperties: false
    PublishOpenFederationDHTRecordRequest:
      type: object
      required: [namespace, record]
      properties:
        namespace: { type: string }
        record: { $ref: "#/components/schemas/OpenFederationDHTRecord" }
      additionalProperties: false
    ListOpenFederationDHTRecordsRequest:
      type: object
      required: [namespace, limit]
      properties:
        namespace: { type: string }
        limit:
          type: [integer, "null"]
          minimum: 1
      additionalProperties: false
    RelayInfo:
      type: object
      required:
        - kind
        - federation
        - temporalBucketSeconds
        - temporalBucketScheduleSeconds
        - attachmentDefaultTTLSeconds
        - attachmentMaxTTLSeconds
        - attachmentsEnabled
        - attachmentStorageBackend
        - hiddenRetrieval
        - onionTransport
        - mixnetTransport
        - wakeSupport
        - iceService
        - relayName
        - operatorNote
        - softwareVersion
        - protocolCapabilities
        - requiresPassword
        - tlsEnabled
        - transport
        - federationCoordinatorEndpoints
        - coordinatorReportedRelayCount
        - coordinatorRegistrationAuthRequired
        - curatedStrictPolicyEnabled
        - curatedCoordinatorQuorum
        - curatedRequireSignedDirectory
        - federationDirectoryPublicKey
        - knownOpenPeers
        - openFederationDiscovery
        - relayIdentity
        - advertisedAt
      description: |
        Current exact relay advertisement. Every key is present; unavailable
        optional values are encoded as explicit null. All dates use canonical
        whole-second UTC encoding. Endpoint arrays contain canonical unique
        endpoints. temporalBucketScheduleSeconds is sorted and unique, and an
        attachment maximum TTL cannot be lower than its default TTL.
      properties:
        kind:
          type: string
          enum: [standard, passthrough, host]
        federation:
          $ref: "#/components/schemas/FederationDescriptor"
        temporalBucketSeconds:
          type: integer
          minimum: 0
          maximum: 86400
        temporalBucketScheduleSeconds:
          oneOf:
            - type: array
              minItems: 1
              maxItems: 16
              uniqueItems: true
              items:
                type: integer
                minimum: 1
                maximum: 86400
            - type: "null"
        attachmentDefaultTTLSeconds:
          type: [integer, "null"]
          minimum: 60
          maximum: 2592000
        attachmentMaxTTLSeconds:
          type: [integer, "null"]
          minimum: 60
          maximum: 2592000
        attachmentsEnabled:
          type: [boolean, "null"]
        attachmentStorageBackend:
          type: [string, "null"]
          maxLength: 1024
          description: When non-null, UTF-8 encoding MUST be at most 1024 bytes.
        hiddenRetrieval:
          oneOf:
            - $ref: "#/components/schemas/HiddenRetrievalSupport"
            - type: "null"
        onionTransport:
          oneOf:
            - $ref: "#/components/schemas/OnionTransportSupport"
            - type: "null"
        mixnetTransport:
          oneOf:
            - $ref: "#/components/schemas/MixnetTransportSupport"
            - type: "null"
        wakeSupport:
          oneOf:
            - $ref: "#/components/schemas/DecentralizedWakeSupport"
            - type: "null"
        iceService:
          oneOf:
            - $ref: "#/components/schemas/RelayICEServiceDescriptorV1"
            - type: "null"
        relayName:
          type: [string, "null"]
          maxLength: 1024
          description: When non-null, UTF-8 encoding MUST be at most 1024 bytes.
        operatorNote:
          type: [string, "null"]
          maxLength: 1024
          description: When non-null, UTF-8 encoding MUST be at most 1024 bytes.
        softwareVersion:
          type: [string, "null"]
          maxLength: 1024
          readOnly: true
          description: |
            Binary-defined software identifier; not operator-controlled. When
            non-null, UTF-8 encoding MUST be at most 1024 bytes.
        protocolCapabilities:
          oneOf:
            - $ref: "#/components/schemas/RelayCapabilityManifestV2"
            - type: "null"
        requiresPassword:
          type: [boolean, "null"]
        tlsEnabled:
          type: [boolean, "null"]
        transport:
          type: [string, "null"]
          enum: [tcp, http, websocket, null]
        federationCoordinatorEndpoints:
          oneOf:
            - type: array
              maxItems: 16
              uniqueItems: true
              items:
                $ref: "#/components/schemas/RelayEndpoint"
            - type: "null"
        coordinatorReportedRelayCount:
          type: [integer, "null"]
          minimum: 0
          maximum: 1000000
        coordinatorRegistrationAuthRequired:
          type: [boolean, "null"]
        curatedStrictPolicyEnabled:
          type: [boolean, "null"]
        curatedCoordinatorQuorum:
          type: [integer, "null"]
          minimum: 1
          maximum: 16
        curatedRequireSignedDirectory:
          type: [boolean, "null"]
        federationDirectoryPublicKey:
          type: [string, "null"]
          contentEncoding: base64
          minLength: 2604
          maxLength: 2604
          description: Base64-encoded current ML-DSA-65 public key when present.
        knownOpenPeers:
          oneOf:
            - type: array
              maxItems: 128
