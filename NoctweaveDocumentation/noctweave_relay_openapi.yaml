openapi: 3.1.0
info:
  title: Noctweave Relay API
  version: "1.0.0"
  description: |
    HTTP/WebSocket bridge for Noctweave Protocol relay requests. TCP uses the
    same RelayRequest and RelayResponse JSON objects as one newline-delimited
    request per connection. Opaque route v2 is the direct-delivery substrate;
    relays route fixed-size sealed packets without user or conversation state.
servers:
  - url: http://localhost:9340
    description: Local HTTP relay bridge
  - url: https://relay.example.org
    description: TLS relay bridge or reverse proxy
paths:
  /relay:
    post:
      summary: Submit one relay protocol request
      operationId: postRelayRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelayRequest"
      responses:
        "200":
          description: Relay protocol response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelayResponse"
        "400":
          description: The body is not an exact, current RelayRequest envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPTransportError"
        "413":
          description: Request body exceeds the configured relay limit
        "429":
          description: Source request rate limit exceeded
        "502":
          description: Relay handler or upstream forwarding failed
    get:
      summary: WebSocket upgrade endpoint
      operationId: websocketRelay
      responses:
        "101":
          description: WebSocket upgrade accepted; clients exchange RelayRequest and RelayResponse JSON frames.
components:
  schemas:
    RelayRequest:
      type: object
      description: |
        Exact request-correlated protocol envelope. Every key is mandatory;
        authToken is explicitly null when unused. Module/version/method select
        exactly one body shape. Unknown keys and unsupported bindings are rejected.
      required: [requestID, module, version, method, body, authToken]
      properties:
        requestID:
          type: string
          format: uuid
        module:
          $ref: "#/components/schemas/RelayModuleID"
        version:
          type: integer
          minimum: 1
        method:
          $ref: "#/components/schemas/RelayMethodID"
        body:
          type: object
        authToken:
          type: [string, "null"]
          minLength: 1
          maxLength: 4096
          description: Optional relay password or coordinator registration token.
      additionalProperties: false
      allOf:
        - oneOf:
            - $ref: "#/components/schemas/CoreHealthRequestBinding"
            - $ref: "#/components/schemas/CoreInfoRequestBinding"
            - $ref: "#/components/schemas/ICECredentialRequestBinding"
            - $ref: "#/components/schemas/OpaqueRouteCreateRequestBinding"
            - $ref: "#/components/schemas/OpaqueRouteRenewRequestBinding"
            - $ref: "#/components/schemas/OpaqueRouteTeardownRequestBinding"
            - $ref: "#/components/schemas/OpaqueRouteAppendRequestBinding"
            - $ref: "#/components/schemas/OpaqueRouteSyncRequestBinding"
            - $ref: "#/components/schemas/OpaqueRouteCommitRequestBinding"
            - $ref: "#/components/schemas/RendezvousRegisterRequestBinding"
            - $ref: "#/components/schemas/RendezvousAppendRequestBinding"
            - $ref: "#/components/schemas/RendezvousSyncRequestBinding"
            - $ref: "#/components/schemas/RendezvousDeleteRequestBinding"
            - $ref: "#/components/schemas/BlobUploadRequestBinding"
            - $ref: "#/components/schemas/BlobFetchRequestBinding"
            - $ref: "#/components/schemas/FederationRegisterRequestBinding"
            - $ref: "#/components/schemas/FederationListRequestBinding"
            - $ref: "#/components/schemas/FederationNamespaceRequestBinding"
            - $ref: "#/components/schemas/FederationClaimRequestBinding"
            - $ref: "#/components/schemas/FederationRotateRequestBinding"
            - $ref: "#/components/schemas/FederationReleaseRequestBinding"
            - $ref: "#/components/schemas/FederationForwardRequestBinding"
            - $ref: "#/components/schemas/FederationDeliverRequestBinding"
            - $ref: "#/components/schemas/FederationHostGetRequestBinding"
            - $ref: "#/components/schemas/FederationHostResolveRequestBinding"
            - $ref: "#/components/schemas/OpenDiscoveryPublishDHTRequestBinding"
            - $ref: "#/components/schemas/OpenDiscoveryListDHTRequestBinding"
            - $ref: "#/components/schemas/NetPassthroughForwardRequestBinding"
            - $ref: "#/components/schemas/NetHostPutRequestBinding"
            - $ref: "#/components/schemas/NetHostBindRequestBinding"
            - $ref: "#/components/schemas/NetHostGetRequestBinding"
            - $ref: "#/components/schemas/NetHostResolveRequestBinding"
            - $ref: "#/components/schemas/NetHostHasRequestBinding"
            - $ref: "#/components/schemas/NetHostReleaseRequestBinding"
    RelayModuleID:
      type: string
      enum:
        - nw.core
        - nw.opaque-route
        - nw.rendezvous-transport
        - nw.blobs
        - nw.ice-service
        - nw.federation
        - nw.federation-forward
        - nw.open-discovery
        - nw.net-passthrough
        - nw.net-host
    RelayMethodID:
      type: string
      enum: [health, info, create, renew, teardown, append, sync, commit, register, delete, upload, fetch, list, namespace, claim, rotate, publish-dht, list-dht, forward, deliver, put, bind, get, resolve, has, release, acquire]
    RelayResponse:
      type: object
      description: |
        Exact response envelope. requestID, module, version, and method MUST
        equal the request. Success has a non-null operation body and null error;
        failure has null body and a bounded structured error.
      required: [requestID, module, version, method, status, body, error]
      properties:
        requestID:
          type: string
          format: uuid
        module:
          $ref: "#/components/schemas/RelayModuleID"
        version:
          type: integer
          minimum: 1
        method:
          $ref: "#/components/schemas/RelayMethodID"
        status:
          type: string
          enum: [success, error]
        body:
          oneOf:
            - $ref: "#/components/schemas/EmptyBody"
            - $ref: "#/components/schemas/RelayInfoSuccessBody"
            - $ref: "#/components/schemas/ICECredentialsSuccessBody"
            - $ref: "#/components/schemas/OpaqueRouteSuccessBody"
            - $ref: "#/components/schemas/OpaqueRouteAppendSuccessBody"
            - $ref: "#/components/schemas/OpaqueRouteSyncSuccessBody"
            - $ref: "#/components/schemas/OpaqueRouteCommitSuccessBody"
            - $ref: "#/components/schemas/RendezvousSyncSuccessBody"
            - $ref: "#/components/schemas/AttachmentSuccessBody"
            - $ref: "#/components/schemas/FederationNodesSuccessBody"
            - $ref: "#/components/schemas/NoctwebNamespaceSnapshotSuccessBody"
            - $ref: "#/components/schemas/NoctwebNamespaceRecordSuccessBody"
            - $ref: "#/components/schemas/DHTRecordsSuccessBody"
            - $ref: "#/components/schemas/NetPassthroughSuccessBody"
            - $ref: "#/components/schemas/NetHostReceiptSuccessBody"
            - $ref: "#/components/schemas/NetHostObjectSuccessBody"
            - $ref: "#/components/schemas/FederatedNetHostObjectSuccessBody"
            - $ref: "#/components/schemas/NetHostNameResolutionSuccessBody"
            - $ref: "#/components/schemas/FederatedNetHostNameResolutionSuccessBody"
            - $ref: "#/components/schemas/NetHostPresenceSuccessBody"
            - $ref: "#/components/schemas/NetHostReleaseSuccessBody"
            - type: "null"
        error:
          oneOf:
            - $ref: "#/components/schemas/RelayErrorBody"
            - type: "null"
      additionalProperties: false
      oneOf:
        - properties:
            status:
              const: success
            body:
              oneOf:
                - $ref: "#/components/schemas/EmptyBody"
                - $ref: "#/components/schemas/RelayInfoSuccessBody"
                - $ref: "#/components/schemas/ICECredentialsSuccessBody"
                - $ref: "#/components/schemas/OpaqueRouteSuccessBody"
                - $ref: "#/components/schemas/OpaqueRouteAppendSuccessBody"
                - $ref: "#/components/schemas/OpaqueRouteSyncSuccessBody"
                - $ref: "#/components/schemas/OpaqueRouteCommitSuccessBody"
                - $ref: "#/components/schemas/RendezvousSyncSuccessBody"
                - $ref: "#/components/schemas/AttachmentSuccessBody"
                - $ref: "#/components/schemas/FederationNodesSuccessBody"
                - $ref: "#/components/schemas/NoctwebNamespaceSnapshotSuccessBody"
                - $ref: "#/components/schemas/NoctwebNamespaceRecordSuccessBody"
                - $ref: "#/components/schemas/DHTRecordsSuccessBody"
                - $ref: "#/components/schemas/NetPassthroughSuccessBody"
                - $ref: "#/components/schemas/NetHostReceiptSuccessBody"
                - $ref: "#/components/schemas/NetHostObjectSuccessBody"
                - $ref: "#/components/schemas/FederatedNetHostObjectSuccessBody"
                - $ref: "#/components/schemas/NetHostNameResolutionSuccessBody"
                - $ref: "#/components/schemas/FederatedNetHostNameResolutionSuccessBody"
                - $ref: "#/components/schemas/NetHostPresenceSuccessBody"
                - $ref: "#/components/schemas/NetHostReleaseSuccessBody"
            error:
              type: "null"
        - properties:
            status:
              const: error
            body:
              type: "null"
            error:
              $ref: "#/components/schemas/RelayErrorBody"
    RelayErrorBody:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          type: string
          enum: [authentication-required, rate-limited, invalid-request, unavailable, not-found, conflict, capacity, internal-failure]
        message:
          type: string
          minLength: 1
          maxLength: 512
          description: UTF-8 encoded length is limited to 512 bytes by implementations.
        retryable:
          type: boolean
      additionalProperties: false
    HTTPTransportError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          maxLength: 512
      additionalProperties: false
    EmptyBody:
      type: object
      maxProperties: 0
      additionalProperties: false
    CoreHealthRequestBinding:
      type: object
      properties:
        module: { const: nw.core }
        version: { const: 2 }
        method: { const: health }
        body: { $ref: "#/components/schemas/EmptyBody" }
    CoreInfoRequestBinding:
      type: object
      properties:
        module: { const: nw.core }
        version: { const: 2 }
        method: { const: info }
        body: { $ref: "#/components/schemas/EmptyBody" }
    ICECredentialRequestBinding:
      type: object
      properties:
        module: { const: nw.ice-service }
        version: { const: 1 }
        method: { const: acquire }
        body: { $ref: "#/components/schemas/ICECredentialRequestBody" }
    OpaqueRouteCreateRequestBinding:
      type: object
      properties:
        module: { const: nw.opaque-route }
        version: { const: 2 }
        method: { const: create }
        body: { $ref: "#/components/schemas/OpaqueRouteCreateSubmissionV2" }
    OpaqueRouteRenewRequestBinding:
      type: object
      properties:
        module: { const: nw.opaque-route }
        version: { const: 2 }
        method: { const: renew }
        body: { $ref: "#/components/schemas/OpaqueRouteRenewSubmissionV2" }
    OpaqueRouteTeardownRequestBinding:
      type: object
      properties:
        module: { const: nw.opaque-route }
        version: { const: 2 }
        method: { const: teardown }
        body: { $ref: "#/components/schemas/OpaqueRouteTeardownSubmissionV2" }
    OpaqueRouteAppendRequestBinding:
      type: object
      properties:
        module: { const: nw.opaque-route }
        version: { const: 2 }
        method: { const: append }
        body: { $ref: "#/components/schemas/OpaqueRouteAppendSubmissionV2" }
    OpaqueRouteSyncRequestBinding:
      type: object
      properties:
        module: { const: nw.opaque-route }
        version: { const: 2 }
        method: { const: sync }
        body: { $ref: "#/components/schemas/OpaqueRouteSyncSubmissionV2" }
    OpaqueRouteCommitRequestBinding:
      type: object
      properties:
        module: { const: nw.opaque-route }
        version: { const: 2 }
        method: { const: commit }
        body: { $ref: "#/components/schemas/OpaqueRouteCommitSubmissionV2" }
    RendezvousRegisterRequestBinding:
      type: object
      properties:
        module: { const: nw.rendezvous-transport }
        version: { const: 2 }
        method: { const: register }
        body: { $ref: "#/components/schemas/RegisterRendezvousTransportV2Request" }
    RendezvousAppendRequestBinding:
      type: object
      properties:
        module: { const: nw.rendezvous-transport }
        version: { const: 2 }
        method: { const: append }
        body: { $ref: "#/components/schemas/AppendRendezvousTransportV2Request" }
    RendezvousSyncRequestBinding:
      type: object
      properties:
        module: { const: nw.rendezvous-transport }
        version: { const: 2 }
        method: { const: sync }
        body: { $ref: "#/components/schemas/SyncRendezvousTransportV2Request" }
    RendezvousDeleteRequestBinding:
      type: object
      properties:
        module: { const: nw.rendezvous-transport }
        version: { const: 2 }
        method: { const: delete }
        body: { $ref: "#/components/schemas/DeleteRendezvousTransportV2Request" }
    BlobUploadRequestBinding:
      type: object
      properties:
        module: { const: nw.blobs }
        version: { const: 1 }
        method: { const: upload }
        body: { $ref: "#/components/schemas/UploadAttachmentRequest" }
    BlobFetchRequestBinding:
      type: object
      properties:
        module: { const: nw.blobs }
        version: { const: 1 }
        method: { const: fetch }
        body: { $ref: "#/components/schemas/FetchAttachmentRequest" }
    FederationRegisterRequestBinding:
      type: object
      properties:
        module: { const: nw.federation }
        version: { const: 1 }
        method: { const: register }
        body: { $ref: "#/components/schemas/FederationNodeRegistrationRequest" }
    FederationListRequestBinding:
      type: object
      properties:
        module: { const: nw.federation }
        version: { const: 1 }
        method: { const: list }
        body: { $ref: "#/components/schemas/ListFederationNodesRequest" }
    FederationNamespaceRequestBinding:
      type: object
      properties:
        module: { const: nw.federation }
        version: { const: 1 }
        method: { const: namespace }
        body: { $ref: "#/components/schemas/NoctwebNamespaceSnapshotRequestV1" }
    FederationClaimRequestBinding:
      type: object
      properties:
        module: { const: nw.federation }
        version: { const: 1 }
        method: { const: claim }
        body: { $ref: "#/components/schemas/NoctwebNamespaceClaimRequestV1" }
    FederationRotateRequestBinding:
      type: object
      properties:
        module: { const: nw.federation }
        version: { const: 1 }
        method: { const: rotate }
        body: { $ref: "#/components/schemas/NoctwebNamespaceRotationRequestV1" }
    FederationReleaseRequestBinding:
      type: object
      properties:
        module: { const: nw.federation }
        version: { const: 1 }
        method: { const: release }
        body: { $ref: "#/components/schemas/NoctwebNamespaceReleaseV1" }
    FederationForwardRequestBinding:
      type: object
      properties:
        module: { const: nw.federation-forward }
        version: { const: 1 }
        method: { const: forward }
        body: { $ref: "#/components/schemas/FederatedOpaqueRouteForwardRequestV1" }
    FederationDeliverRequestBinding:
      type: object
      properties:
        module: { const: nw.federation-forward }
        version: { const: 1 }
        method: { const: deliver }
        body: { $ref: "#/components/schemas/FederatedOpaqueRouteDeliveryV1" }
    FederationHostGetRequestBinding:
      type: object
      properties:
        module: { const: nw.federation-forward }
        version: { const: 1 }
        method: { const: get }
        body: { $ref: "#/components/schemas/FederatedNetHostReadRequestV1" }
    FederationHostResolveRequestBinding:
      type: object
      properties:
        module: { const: nw.federation-forward }
        version: { const: 1 }
        method: { const: resolve }
        body: { $ref: "#/components/schemas/FederatedNetHostNameReadRequestV1" }
    OpenDiscoveryPublishDHTRequestBinding:
      type: object
      properties:
        module: { const: nw.open-discovery }
        version: { const: 1 }
        method: { const: publish-dht }
        body: { $ref: "#/components/schemas/PublishOpenFederationDHTRecordRequest" }
    OpenDiscoveryListDHTRequestBinding:
      type: object
      properties:
        module: { const: nw.open-discovery }
        version: { const: 1 }
        method: { const: list-dht }
        body: { $ref: "#/components/schemas/ListOpenFederationDHTRecordsRequest" }
    NetPassthroughForwardRequestBinding:
      type: object
      properties:
        module: { const: nw.net-passthrough }
        version: { const: 1 }
        method: { const: forward }
        body: { $ref: "#/components/schemas/NoctweaveNetPassthroughRequest" }
    NetHostPutRequestBinding:
      type: object
      properties:
        module: { const: nw.net-host }
        version: { const: 1 }
        method: { const: put }
        body: { $ref: "#/components/schemas/NoctweaveNetHostPutRequest" }
    NetHostBindRequestBinding:
      type: object
      properties:
        module: { const: nw.net-host }
        version: { const: 1 }
        method: { const: bind }
        body: { $ref: "#/components/schemas/NoctweaveNetHostNameBindingRequestV1" }
    NetHostGetRequestBinding:
      type: object
      properties:
        module: { const: nw.net-host }
        version: { const: 1 }
        method: { const: get }
        body: { $ref: "#/components/schemas/NoctweaveNetHostObjectRequest" }
    NetHostResolveRequestBinding:
      type: object
      properties:
        module: { const: nw.net-host }
        version: { const: 1 }
        method: { const: resolve }
        body: { $ref: "#/components/schemas/NoctweaveNetHostNameRequestV1" }
    NetHostHasRequestBinding:
      type: object
      properties:
        module: { const: nw.net-host }
        version: { const: 1 }
        method: { const: has }
        body: { $ref: "#/components/schemas/NoctweaveNetHostObjectRequest" }
    NetHostReleaseRequestBinding:
      type: object
      properties:
        module: { const: nw.net-host }
        version: { const: 1 }
        method: { const: release }
        body: { $ref: "#/components/schemas/NoctweaveNetHostReleaseRequest" }
    RelayInfoSuccessBody:
      type: object
      required: [relayInfo]
      properties:
        relayInfo: { $ref: "#/components/schemas/RelayInfo" }
      additionalProperties: false
    ICECredentialsSuccessBody:
      type: object
      required: [credentials]
      properties:
        credentials: { $ref: "#/components/schemas/RelayICECredentialsV1" }
      additionalProperties: false
    OpaqueRouteSuccessBody:
      type: object
      required: [route]
      properties:
        route: { $ref: "#/components/schemas/OpaqueReceiveRouteV2" }
      additionalProperties: false
    OpaqueRouteAppendSuccessBody:
      type: object
      required: [receipt]
      properties:
        receipt: { $ref: "#/components/schemas/OpaqueRouteAppendReceiptV2" }
      additionalProperties: false
    OpaqueRouteSyncSuccessBody:
      type: object
      required: [batch]
      properties:
        batch: { $ref: "#/components/schemas/OpaqueRouteSyncResponseV2" }
      additionalProperties: false
    OpaqueRouteCommitSuccessBody:
      type: object
      required: [commit]
      properties:
        commit: { $ref: "#/components/schemas/OpaqueRouteCommitResponseV2" }
      additionalProperties: false
    RendezvousSyncSuccessBody:
      type: object
      required: [batch]
      properties:
        batch: { $ref: "#/components/schemas/RendezvousRelaySyncBatchV2" }
      additionalProperties: false
    AttachmentSuccessBody:
      type: object
      required: [chunk]
      properties:
        chunk: { $ref: "#/components/schemas/AttachmentChunk" }
      additionalProperties: false
    FederationNodesSuccessBody:
      type: object
      required: [nodes, snapshot]
      properties:
        nodes:
          type: array
          maxItems: 10000
          uniqueItems: true
          description: Relay endpoints MUST be unique after canonical endpoint normalization.
          items: { $ref: "#/components/schemas/FederationNodeRecord" }
        snapshot:
          oneOf:
            - $ref: "#/components/schemas/FederationDirectorySnapshot"
            - type: "null"
      additionalProperties: false
    NoctwebNamespaceSnapshotSuccessBody:
      type: object
      required: [namespaceSnapshot]
      properties:
        namespaceSnapshot:
          $ref: "#/components/schemas/NoctwebNamespaceSnapshotV1"
      additionalProperties: false
    NoctwebNamespaceRecordSuccessBody:
      type: object
      required: [namespaceRecord]
      properties:
        namespaceRecord:
          $ref: "#/components/schemas/NoctwebNamespaceRecordV1"
      additionalProperties: false
    DHTRecordsSuccessBody:
      type: object
      required: [records]
      properties:
        records:
          type: array
          items: { $ref: "#/components/schemas/OpenFederationDHTRecord" }
      additionalProperties: false
    NetPassthroughSuccessBody:
      type: object
      required: [passthrough]
      properties:
        passthrough: { $ref: "#/components/schemas/NoctweaveNetPassthroughResponse" }
      additionalProperties: false
    NetHostReceiptSuccessBody:
      type: object
      required: [receipt]
      properties:
        receipt: { $ref: "#/components/schemas/NoctweaveNetHostingReceipt" }
      additionalProperties: false
    NetHostObjectSuccessBody:
      type: object
      required: [object]
      properties:
        object: { $ref: "#/components/schemas/NoctweaveNetHostFetchResponse" }
      additionalProperties: false
    FederatedNetHostObjectSuccessBody:
      type: object
      required: [federatedObject]
      properties:
        federatedObject:
          $ref: "#/components/schemas/FederatedNetHostObjectResponseV1"
      additionalProperties: false
    NetHostNameResolutionSuccessBody:
      type: object
      required: [nameResolution]
      properties:
        nameResolution:
          $ref: "#/components/schemas/NoctweaveNetHostNameResolutionV1"
      additionalProperties: false
    FederatedNetHostNameResolutionSuccessBody:
      type: object
      required: [federatedNameResolution]
      properties:
        federatedNameResolution:
          $ref: "#/components/schemas/FederatedNetHostNameResponseV1"
      additionalProperties: false
    NetHostPresenceSuccessBody:
      type: object
      required: [presence]
      properties:
        presence: { $ref: "#/components/schemas/NoctweaveNetHostPresence" }
      additionalProperties: false
    NetHostReleaseSuccessBody:
      type: object
      required: [release]
      properties:
        release: { $ref: "#/components/schemas/NoctweaveNetHostReleaseReceipt" }
      additionalProperties: false
    NoctweaveNetPassthroughRequest:
      type: object
      required: [destination, payload]
      properties:
        destination: { $ref: "#/components/schemas/NoctweaveNetPassthroughEndpoint" }
        payload:
          type: string
          contentEncoding: base64
          minLength: 4
          maxLength: 699052
      additionalProperties: false
    NoctweaveNetPassthroughEndpoint:
      allOf:
        - $ref: "#/components/schemas/RelayEndpoint"
        - type: object
          properties:
            useTLS: { const: true }
            transport: { const: http }
    NoctweaveNetPassthroughResponse:
      type: object
      required: [payload]
      properties:
        payload:
          type: string
          contentEncoding: base64
          minLength: 4
          maxLength: 699052
      additionalProperties: false
    NoctweaveNetHostPutRequest:
      type: object
      required: [objectID, payload, ttlSeconds, releaseCapabilityDigest, idempotencyKey]
      properties:
        objectID:
          type: string
          pattern: "^[0-9a-f]{64}$"
        payload:
          type: string
          contentEncoding: base64
          minLength: 4
          maxLength: 1398104
        ttlSeconds:
          type: [integer, "null"]
          minimum: 60
          maximum: 2592000
        releaseCapabilityDigest:
          type: string
          contentEncoding: base64
          minLength: 44
          maxLength: 44
        idempotencyKey:
          type: string
          contentEncoding: base64
          minLength: 44
          maxLength: 44
      additionalProperties: false
    NoctweaveNetHostObjectRequest:
      type: object
      required: [objectID]
      properties:
        objectID:
          type: string
          pattern: "^[0-9a-f]{64}$"
      additionalProperties: false
    NoctweaveNetHostReleaseRequest:
      type: object
      required: [objectID, releaseCapability]
      properties:
        objectID:
          type: string
          pattern: "^[0-9a-f]{64}$"
        releaseCapability:
          type: string
          contentEncoding: base64
          minLength: 44
          maxLength: 44
      additionalProperties: false
    NoctweaveNetHostingReceipt:
      type: object
      required: [objectID, byteCount, storedAt, expiresAt, signingPublicKey, signatureAlgorithm, signature]
      properties:
        objectID:
          type: string
          pattern: "^[0-9a-f]{64}$"
        byteCount:
          type: integer
          minimum: 1
          maximum: 1048576
        storedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        signingPublicKey:
          type: string
          contentEncoding: base64
          minLength: 44
          maxLength: 44
        signatureAlgorithm:
          type: string
          const: Ed25519
        signature:
          type: string
          contentEncoding: base64
          minLength: 88
          maxLength: 88
      additionalProperties: false
    NoctweaveNetHostFetchResponse:
      type: object
      required: [receipt, payload]
      properties:
        receipt: { $ref: "#/components/schemas/NoctweaveNetHostingReceipt" }
        payload:
          type: string
          contentEncoding: base64
          minLength: 4
          maxLength: 1398104
      additionalProperties: false
    NoctweaveNetHostPresence:
      type: object
      required: [objectID, present, expiresAt]
